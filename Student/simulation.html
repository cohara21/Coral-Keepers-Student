<body>
  <div class="sim-standalone">
<div class="sim-card" role="region" aria-label="Coral Simulation">

          <div class="sim-left">
            <img src="../assets/Inside tank view.webp" alt="Simulation preview" id="cory-avatar" />
          </div>

          <div class="sim-right">
            <div class="sim-score-row">
              <div class="sim-score-group">
                <div class="sim-score" id="health-score-display">92%</div>
                <div class="sim-score-label">AI Health Score</div>
              </div>
              <button type="button" id="btn-reset-small" class="sim-reset-fab" title="Reset to Ideal Parameters"
                aria-label="Reset to ideal parameters">
                <img src="../assets/refresh.svg" alt="">
              </button>
            </div>
            <div class="sim-metric">
              <div class="metric-label"><span>Temperature</span><img
                  src="../assets/7bd8d3c0-7663-4246-86b1-265d54c9882a.svg" alt="" /></div>
              <div class="metric-row">
                <input type="range" id="temp-slider" min="60" max="100" step="1" value="78" class="sim-slider"
                  data-type="temperature">
                <div class="metric-value">78° F</div>
              </div>
            </div>

            <div class="sim-metric">
              <div class="metric-label"><span>Salinity</span><img
                  src="../assets/4dea0953-907d-4052-ab20-9cca83cda85c.svg" alt="" /></div>
              <div class="metric-row">
                <input type="range" id="salinity-slider" min="20" max="50" step="1" value="35" class="sim-slider"
                  data-type="salinity">
                <div class="metric-value">35 PPT</div>
              </div>
            </div>

            <div class="sim-metric">
              <div class="metric-label"><span>pH Level</span><img
                  src="../assets/3c41eed2-862f-4820-83ce-73a8f4e7e1d3.svg" alt="" /></div>
              <div class="metric-row">
                <input type="range" id="ph-slider" min="7.0" max="9.0" step="0.1" value="8.2" class="sim-slider"
                  data-type="ph">
                <div class="metric-value">8.20</div>
              </div>
            </div>

            <div class="sim-metric">
              <div class="metric-label"><span>Redox</span><img src="../assets/6267a499-28d2-4255-857c-746abb06886c.svg"
                  alt="" /></div>
              <div class="metric-row">
                <input type="range" id="redox-slider" min="100" max="600" step="10" value="350" class="sim-slider"
                  data-type="redox">
                <div class="metric-value">350 mV</div>
              </div>
            </div>
          </div>
        </div>
  </div>
  <script>
    (function () {
// Make simulation sliders interactive
    const sliders = document.querySelectorAll('.sim-slider');

    function calculateAIHealthScore() {
      const tempSlider = document.getElementById('temp-slider');
      const salinitySlider = document.getElementById('salinity-slider');
      const phSlider = document.getElementById('ph-slider');
      const redoxSlider = document.getElementById('redox-slider');

      if (!tempSlider || !salinitySlider || !phSlider || !redoxSlider) {
        return { totalScore: 94, temp: 78, salinity: 35, ph: 8.2, redox: 350 };
      }

      const temp = parseFloat(tempSlider.value);
      const salinity = parseFloat(salinitySlider.value);
      const ph = parseFloat(phSlider.value);
      const redox = parseFloat(redoxSlider.value);

      let tempScore = 25;
      if (temp < 76) tempScore -= (76 - temp) * 1.6; // Hits 0 at 60
      else if (temp > 82) tempScore -= (temp - 82) * 1.4; // Hits 0 at 100
      tempScore = Math.max(0, tempScore);

      let phScore = 25;
      if (ph < 7.9) phScore -= (7.9 - ph) * 28; // Hits 0 at 7.0
      else if (ph > 8.4) phScore -= (ph - 8.4) * 42; // Hits 0 at 9.0
      phScore = Math.max(0, phScore);

      let salinityScore = 25;
      if (salinity < 33) salinityScore -= (33 - salinity) * 2; // Hits 0 at 20
      else if (salinity > 36) salinityScore -= (salinity - 36) * 1.8; // Hits 0 at 50
      salinityScore = Math.max(0, salinityScore);

      let redoxScore = 25;
      if (redox < 250) redoxScore -= (250 - redox) * 0.17; // Hits 0 at 100
      else if (redox > 450) redoxScore -= (redox - 450) * 0.17; // Hits 0 at 600
      redoxScore = Math.max(0, redoxScore);

      const totalScore = Math.round(tempScore + phScore + salinityScore + redoxScore);

      // Update UI displays
      const healthScoreDisplays = [document.getElementById('health-score-display'), document.getElementById('health-score-display-modal')];

      let scoreColor = '#dc2626'; // Red (Bad)
      if (totalScore >= 90) scoreColor = '#2ecc71'; // Matching dashboard Green (Good)
      else if (totalScore >= 75) scoreColor = '#84cc16'; // Green-Yellow (OK)
      else if (totalScore >= 60) scoreColor = '#facc15'; // Yellow (Medium)
      else if (totalScore >= 40) scoreColor = '#f97316'; // Orange / Yellow-Red (Getting Bad)

      healthScoreDisplays.forEach(el => {
        if (el) {
          el.textContent = totalScore + '%';
          el.style.color = scoreColor;
        }
      });

      let imgName = 'CorySimulation6.webp';
      if (totalScore >= 90) imgName = 'CorySimulation1.webp';
      else if (totalScore >= 75) imgName = 'CorySimulation2.webp';
      else if (totalScore >= 60) imgName = 'CorySimulation3.webp';
      else if (totalScore >= 40) imgName = 'CorySimulation4.webp';
      else if (totalScore >= 20) imgName = 'CorySimulation5.webp';

      const avatars = [document.getElementById('cory-avatar'), document.getElementById('cory-avatar-modal')];
      avatars.forEach(el => {
        if (el) el.src = '../assets/' + imgName;
      });

      return { totalScore, temp, salinity, ph, redox };
    }

    function syncSlidersAndBroadcast(e) {
      const type = e.target.getAttribute('data-type');
      const val = e.target.value;

      document.querySelectorAll(`.sim-slider[data-type="${type}"]`).forEach(s => {
        s.value = val;
        let unit = '';
        if (type === 'temperature') unit = '° F';
        else if (type === 'salinity') unit = ' PPT';
        else if (type === 'redox') unit = ' mV';
        else if (type === 'ph') {
          s.nextElementSibling.textContent = parseFloat(val).toFixed(2);
          return;
        }
        s.nextElementSibling.textContent = val + unit;
      });

      const data = calculateAIHealthScore();

      // Real-time broadcast
      const coryIframe = document.getElementById('cory-iframe');
      if (coryIframe && coryIframe.contentWindow) {
        const liveTankData = {
          temperature: data.temp,
          salinity: data.salinity,
          ph: data.ph,
          healthScore: data.totalScore
        };
        coryIframe.contentWindow.postMessage({ type: 'UPDATE_TANK_DATA', data: liveTankData }, "*");
      }
    }

    sliders.forEach(slider => {
      slider.addEventListener('input', syncSlidersAndBroadcast);
    });

    
function resetSimulationParameters() {
      const defaults = [
        ['temperature', '78', '° F'],
        ['salinity', '35', ' PPT'],
        ['ph', '8.2', null],
        ['redox', '350', ' mV']
      ];
      defaults.forEach(function (row) {
        var type = row[0];
        var val = row[1];
        var unit = row[2];
        document.querySelectorAll('.sim-slider[data-type="' + type + '"]').forEach(function (s) {
          s.value = val;
          var next = s.nextElementSibling;
          if (next) {
            if (type === 'ph') {
              next.textContent = parseFloat(val).toFixed(2);
            } else {
              next.textContent = val + unit;
            }
          }
        });
      });
      var data = calculateAIHealthScore();
      var coryIframe = document.getElementById('cory-iframe');
      if (coryIframe && coryIframe.contentWindow) {
        coryIframe.contentWindow.postMessage({
          type: 'UPDATE_TANK_DATA',
          data: {
            temperature: data.temp,
            salinity: data.salinity,
            ph: data.ph,
            healthScore: data.totalScore
          }
        }, '*');
      }
    }

      var resetBtn = document.getElementById('btn-reset-small');
      if (resetBtn) resetBtn.addEventListener('click', resetSimulationParameters);
      calculateAIHealthScore();
    })();
  </script>
